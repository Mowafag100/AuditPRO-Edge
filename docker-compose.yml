services:
  # ============================================
  # 1. الذكاء الاصطناعي المحلي (Ollama)
  # ============================================
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0
    command: serve
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - audit_network

  # ============================================
  # 2. قاعدة البيانات العلائقية (PostgreSQL)
  # ============================================
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: audituser
      POSTGRES_PASSWORD: securepassword123
      POSTGRES_DB: auditpro
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audituser -d auditpro"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - audit_network
    restart: unless-stopped

  # ============================================
  # 3. قاعدة بيانات المتجهات (ChromaDB) – RAG
  # ============================================
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/api/v2/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - audit_network
    restart: unless-stopped

  # ============================================
  # 4. الخلفية (FastAPI) – مع دعم PostgreSQL و ChromaDB
  # ============================================
  backend:
    build: .
    ports:
      - "8090:8090"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - SECRET_KEY=my_super_secret_key_123
      - GEMINI_API_KEY=your_gemini_key_here
      - DATABASE_URL=postgresql+asyncpg://audituser:securepassword123@postgres:5432/auditpro
      - REDIS_URL=redis://redis:6379
      - CHROMA_HOST=http://chromadb:8000
    depends_on:
      - ollama
      - postgres
      - redis
      - chromadb
    volumes:
      - .:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - audit_network
    restart: unless-stopped

  # ============================================
  # 5. الواجهة الأمامية (Next.js)
  # ============================================
  frontend:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8090
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - audit_network
    restart: unless-stopped

  # ============================================
  # 6. Redis – تخزين مؤقت (جلسات، مهام)
  # ============================================
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - audit_network
    restart: unless-stopped

# ============================================
# الشبكة المخصصة لعزل الخدمات
# ============================================
networks:
  audit_network:
    driver: bridge

# ============================================
# وحدات التخزين الدائمة
# ============================================
volumes:
  ollama_data:
  postgres_data:
  chromadb_data: