services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    command: serve --host 0.0.0.0   # هذه هي الصيغة الصحيحة لبعض الإصدارات
    # إذا لم يعمل --host، جرب --listen 0.0.0.0               # ← بدون أي خيارات إضافية
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── الخلفية (FastAPI) ──
  backend:
    build: .
    ports:
      - "8090:8090"
    environment:
      - OLLAMA_HOST=http://ollama:11434   # ← الاتصال عبر اسم الخدمة
      - SECRET_KEY=my_super_secret_key_123
      - GEMINI_API_KEY=your_gemini_key_here
      - DATABASE_URL=sqlite+aiosqlite:///./platform.db
      - REDIS_URL=redis://redis:6379
    depends_on:
      - ollama
      - redis
    volumes:
      - .:/app
      - ./platform.db:/app/platform.db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ── الواجهة الأمامية (Next.js) ──
  frontend:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8090
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ── قاعدة بيانات مؤقتة (Redis) ──
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

volumes:
  ollama_data: